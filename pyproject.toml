[build-system]
requires=["setuptools==80.10.2", "wheel==0.48.0"]
build-backend="setuptools.build_meta"
[project]
name="tracemeadow"
version="1.0.3"
description="TraceMeadow attributed derivative for offline developer analysis"
readme="项目文档/README.md"
requires-python=">=3.9"
license={file="项目文档/LICENSE"}
dependencies=["construct==2.10.70", "Pygments==2.21.0", "click==8.5.0", "termcolor==3.3.0"]
[project.optional-dependencies]
test=["pytest"]
[project.scripts]
"tracemeadow"="tracemeadow.console:meadow_cli"
[tool.setuptools.packages.find]
where=["src"]
[tool.setuptools.package-data]
"*"=["*.codes", "data/*.json", "data/*.config"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["checks"]

[tool.setuptools.cmdclass]
build_py="tracemeadow_delivery_build.DeliveryBuild"

[tool.setuptools]
license-files = ["项目文档/LICENSE"]
py-modules=["tracemeadow_delivery_build"]

[tool.setuptools.data-files]
"share/tracemeadow"=["项目文档/ORIGIN.md", "项目文档/DEFENSIVE_SCOPE.md", "项目文档/VALIDATION.md", "CURRENT_VALIDATION.json"]
